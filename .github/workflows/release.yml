name: Release

# Uruchamiane tagiem: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# REL-01: token domyślnie tylko do odczytu; zapis wyłącznie w jobie publish.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write       # OIDC dla podpisu Sigstore
      attestations: write   # atestacja pochodzenia paczki
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Testy
        # Wydanie z niezweryfikowanym kodem nie ma sensu.
        run: dotnet test tests/SnakeGame.Tests/SnakeGame.Tests.csproj --configuration Release

      - name: Publikacja samodzielnej binarki
        # self-contained: użytkownik nie musi mieć zainstalowanego .NET.
        run: >
          dotnet publish Snake.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish/${{ matrix.rid }}

      - name: Spakuj
        shell: bash
        run: |
          cd publish
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            7z a "../snake-${{ matrix.rid }}.zip" "${{ matrix.rid }}"
          else
            zip -r "../snake-${{ matrix.rid }}.zip" "${{ matrix.rid }}"
          fi

      - name: Atestacja pochodzenia (Sigstore)
        # Weryfikacja: gh attestation verify snake-<rid>.zip --repo <owner>/SNAKE
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: snake-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snake-${{ matrix.rid }}
          path: snake-${{ matrix.rid }}.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # tylko ten job tworzy wydanie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Sumy kontrolne
        run: |
          cd artifacts
          ls -la
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Opublikuj wydanie
        # `gh` jest preinstalowane na runnerach — o jedną zewnętrzną akcję,
        # której trzeba ufać, mniej.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Snake ${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*
