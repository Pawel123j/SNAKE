name: Release

# Uruchamiane tagiem: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Testy
        # Wydanie z niezweryfikowanym kodem nie ma sensu.
        run: dotnet test tests/SnakeGame.Tests/SnakeGame.Tests.csproj --configuration Release

      - name: Publikacja samodzielnej binarki
        # self-contained: użytkownik nie musi mieć zainstalowanego .NET.
        run: >
          dotnet publish Snake.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish/${{ matrix.rid }}

      - name: Spakuj
        shell: bash
        run: |
          cd publish
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            7z a "../snake-${{ matrix.rid }}.zip" "${{ matrix.rid }}"
          else
            zip -r "../snake-${{ matrix.rid }}.zip" "${{ matrix.rid }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: snake-${{ matrix.rid }}
          path: snake-${{ matrix.rid }}.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Sumy kontrolne
        run: |
          cd artifacts
          ls -la
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Opublikuj wydanie
        # `gh` jest preinstalowane na runnerach — o jedną zewnętrzną akcję,
        # której trzeba ufać, mniej.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Snake ${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*
